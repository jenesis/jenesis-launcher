name: Build Jenesis Launcher

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Route Maven Central through the repository variable MAVEN_REPOSITORY_URI when set
# (the Google Cloud mirror of Central, to avoid Central rate-limiting the runners),
# falling back to Central itself so an unset variable never becomes an empty URI.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 26
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Build and test with Jenesis
        run: java build/jenesis/Make.java

  # The launcher compiles at release 11 so that an executable jar starts on any JVM from 11 on: this job
  # builds it, assembles a jar of a module and a bundled agent around it, and runs that jar on older JVMs.
  older-jvms:
    name: java -jar on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 26
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Build the launcher
        run: java -Djenesis.test.skip=true build/jenesis/Make.java

      - name: Assemble an executable jar of a module and a bundled agent
        run: |
          set -euo pipefail
          launcher="$(find target -path '*/output/artifacts/build.jenesis.launcher-*.jar' | head -1)"
          mkdir -p target/older/app/demo/app target/older/agent/demo/agent target/older/jar/META-INF/jenesis
          printf 'module demo.app {\n}\n' > target/older/app/module-info.java
          cat > target/older/app/demo/app/Main.java <<'JAVA'
          package demo.app;

          public class Main {

              public static void main(String[] arguments) {
                  System.out.println("Main ran in " + Main.class.getModule().getName() + " on Java " + Runtime.version().feature());
              }
          }
          JAVA
          cat > target/older/agent/demo/agent/Agent.java <<'JAVA'
          package demo.agent;

          import java.lang.instrument.Instrumentation;

          public class Agent {

              public static void premain(String arguments, Instrumentation instrumentation) {
                  System.out.println("Agent ran with " + arguments + " and " + (instrumentation == null ? "no " : "") + "instrumentation");
              }
          }
          JAVA
          javac --release 11 -d target/older/jar/jars/demo.app.jar target/older/app/module-info.java target/older/app/demo/app/Main.java
          javac --release 11 -d target/older/jar/jars/agent.jar target/older/agent/demo/agent/Agent.java
          (cd target/older/jar && unzip -q "../../../$launcher" -x module-info.class 'META-INF/*')
          printf 'mainClass=demo.app.Main\nmainModule=demo.app\nmodulepath=demo.app.jar\nclasspath=agent.jar\nagentClass=demo.agent.Agent=bundled\n' > target/older/jar/META-INF/jenesis/application.properties
          printf 'Main-Class: build.jenesis.launcher.Launcher\nLauncher-Agent-Class: build.jenesis.launcher.LauncherAgent\n' > target/older/MANIFEST.MF
          jar --create --file target/older/app.jar --manifest target/older/MANIFEST.MF -C target/older/jar .

      - name: Set up JDK ${{ matrix.java }}
        id: older
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run the jar on Java ${{ matrix.java }}
        run: |
          "${{ steps.older.outputs.path }}/bin/java" -jar target/older/app.jar | tee target/older/run.txt
          grep -qx "Agent ran with bundled and instrumentation" target/older/run.txt
          grep -qx "Main ran in demo.app on Java ${{ matrix.java }}" target/older/run.txt
